<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration - AcademicSyns</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0B0F1A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .form-card {
      background-color: #1A1F3D;
      width: 100%;
      max-width: 500px;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(168, 85, 247, 0.2);
    }

    .form-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFFFFF;
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #00E5FF;
      padding-bottom: 10px;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-group {
      margin-bottom: 18px;
      flex: 1;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #A855F7;
      font-weight: 600;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background-color: #0B0F1A;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #FFFFFF;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-control:focus {
      border-color: #00E5FF;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #00E5FF;
      cursor: pointer;
    }

    .checkbox-group label {
      font-size: 0.9rem;
      color: #FFFFFF;
      cursor: pointer;
      text-transform: none;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: linear-gradient(135deg, #00E5FF, #A855F7);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    .submit-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2 class="form-title">User Registration</h2>
    
    <form action="{% url 'register' %}" method="POST">
      {% csrf_token %}
      
      <!-- User ID / Staff ID -->
      <div class="form-group">
        <label for="user_id">ID</label>
        <input type="text" id="user_id" name="user_id" class="form-control" placeholder="ID" required>
      </div>

      <!-- First Name & Last Name -->
      <div class="form-row">
        <div class="form-group">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" class="form-control" placeholder="First Name" required>
        </div>

        <div class="form-group">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Last Name" required>
        </div>
      </div>

      <!-- Mobile No. -->
      <div class="form-group">
        <label for="mobile_no">Mobile No.</label>
        <input type="tel" id="mobile_no" name="mobile_no" class="form-control" placeholder="Mobile No." required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Email" required>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
      </div>

      <!-- Is Active -->
      <div class="checkbox-group">
        <input type="checkbox" id="is_active" name="is_active" value="true" checked>
        <label for="is_active">Is Active</label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn">Register</button>

    </form>
  </div>

</body>
</html>
