<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | AcademicSyns</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0B0F1A;
            color: white;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: #10182B;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.15);
        }

        h1 {
            text-align: center;
            color: #00E5FF;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #A8AFBF;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #FFFFFF;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            background: #0B0F1A;
            border: 1px solid #39445C;
            border-radius: 8px;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #00E5FF;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #00E5FF;
            color: #0B0F1A;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #A855F7;
            color: white;
        }

        .messages {
            margin-bottom: 20px;
        }

        .error {
            background: #401F2A;
            color: #FF7B9C;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #00E5FF;
            text-decoration: none;
        }

        .back:hover {
            color: #A855F7;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Student Login</h1>

    <p class="subtitle">
        Welcome to AcademicSyns
    </p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="error">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="{% url 'home' %}" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
