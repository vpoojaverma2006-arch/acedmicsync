<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AcademicSyns</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0B0F1A;

            color: white;
        }

        .login-container {

            width: 420px;

            background: #10182B;

            padding: 40px;

            border-radius: 16px;

            border: 1px solid #263552;

            box-shadow:
                0 0 35px rgba(0, 229, 255, 0.12);
        }

        .logo {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .logo span {

            color: #00E5FF;
        }

        .subtitle {

            text-align: center;

            color: #9ca8ba;

            margin-bottom: 30px;

            font-size: 14px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #dbe3f0;

            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border-radius: 8px;

            border: 1px solid #33425f;

            background: #0B0F1A;

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {

            border-color: #00E5FF;

            box-shadow:
                0 0 8px rgba(0, 229, 255, 0.2);
        }

        .login-button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #00E5FF;

            color: #000;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {

            box-shadow:
                0 0 20px rgba(0, 229, 255, 0.4);
        }

        .error {

            background: rgba(255, 70, 70, 0.12);

            border: 1px solid #ff4d4d;

            color: #ff7070;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #9ca8ba;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {

            color: #00E5FF;
        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="logo">
        🎓 Academic<span>Syns</span>
    </div>

    <div class="subtitle">
        Login to your AcademicSyns account
    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            Username / Email
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username or email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

    </form>


    <a
        href="/"
        class="back"
    >
        ← Back to Home
    </a>

</div>


</body>

</html>
